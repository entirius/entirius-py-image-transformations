[project]
name = "entirius-py-image-transformations"
version = "2.0.0"
description = "Image resize and background removal (Pillow + OpenCV), part of Entirius, the open-source modular ecommerce platform"
keywords = ["image", "resize", "background-removal", "pillow", "opencv", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "pillow>=9.1.1",
    "opencv-contrib-python>=4.5",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-image-transformations"
Changelog = "https://github.com/entirius/entirius-py-image-transformations/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-image-transformations/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_transformations"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["image_transformations"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
